<!DOCTYPE html>
<html lang="ru" class="weekly-page" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="weeqo" />
    <meta name="description" content="расписание группы тм-303/б" />
    <link rel="icon" href="images/weekly.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/weekly-180.png" />
    <title>weeqo · тм-303/б</title>
    <link rel="stylesheet" href="assets/index-DpiSe78P.css" />
    <link rel="stylesheet" href="assets/weekly-VO4sFbvD.css" />
    <link rel="stylesheet" href="assets/WeeklyApp-BMeQie97.css" />
    <link rel="stylesheet" href="assets/weekly-transitions-BckgDRnH.css" />
    <link rel="stylesheet" href="assets/weekly-opaque-GLxzbT3R.css" />
    <link rel="stylesheet" href="css/patch.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script type="module" src="js/app.js"></script>
      <style>[hidden] { display: none !important; }</style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading-state" id="loader" role="status" aria-live="polite">
        <div class="app-loading-mark" aria-hidden="true">
          <div class="app-loading-mark-blur"></div>
          <div class="app-loading-mark-surface">
            <svg class="weeqo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
          </div>
        </div>
      </div>

      <div class="weekly-app is-schedule-tab" id="app" hidden>
        <header class="weekly-header">
          <div class="weekly-title-row">
            <button
              class="weekly-week-switch is-header-leading is-static"
              id="week-switch"
              type="button"
              disabled
              aria-label="чётность недели"
            >
              <span class="weekly-week-badge" id="week-badge">
                <span class="weekly-academic-week" id="week-number">1</span>
                <span id="week-parity">нечётная</span>
              </span>
            </button>

            <h1>
              <span class="weekly-header-brand is-playing" id="brand">
                <span class="weekly-header-mark">
                  <svg class="weeqo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
                </span>
                <span class="weekly-header-word">weeqo</span>
                <span class="weekly-header-spark is-first"></span>
                <span class="weekly-header-spark is-second"></span>
              </span>
            </h1>

            <div class="weekly-header-actions">
              <button
                class="weekly-theme-toggle"
                id="theme-toggle"
                type="button"
                aria-pressed="false"
                aria-label="тема"
              >
                <span aria-hidden="true"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" />
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                  <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
                </svg>
              </button>

              <div class="weekly-settings" id="settings">
                <button
                  class="weekly-settings-trigger"
                  id="settings-trigger"
                  type="button"
                  aria-expanded="false"
                  aria-label="настройки"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                    />
                  </svg>
                </button>

                <div
                  class="weekly-settings-popover t-dropdown"
                  id="settings-popover"
                  data-origin="top-right"
                  role="dialog"
                  aria-label="настройки"
                >
                  <div class="weekly-settings-group">
                    <div class="weekly-settings-row">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-theme">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 4v1M12 19v1M4 12h1M19 12h1M6.3 6.3l.7.7M17 17l.7.7M17.7 6.3l-.7.7M7 17l-.7.7" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>тёмная тема</strong>
                          <span id="theme-hint">светлая</span>
                        </span>
                      </span>
                      <button
                        class="weekly-setting-switch"
                        id="dark-switch"
                        type="button"
                        aria-pressed="false"
                        aria-label="тёмная тема"
                      >
                        <span aria-hidden="true"></span>
                      </button>
                    </div>

                    <div class="weekly-settings-row">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-palette">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 0-4H13a2 2 0 0 1 0-4h4a4 4 0 0 0 4-4 6 6 0 0 0-6-6z" />
                            <circle cx="8" cy="9" r="1.2" />
                            <circle cx="7" cy="14" r="1.2" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>палитра</strong>
                          <span id="palette-hint">базовая</span>
                        </span>
                      </span>
                      <button class="weekly-palette-toggle" id="palette-toggle" type="button" aria-label="палитра">
                        <i></i><i></i><i></i><i></i>
                      </button>
                    </div>

                    <div class="weekly-settings-row">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-layout">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="16" rx="3" />
                            <path d="M3 10h18M9 10v10" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>показывать окна</strong>
                          <span>пустые пары в списке</span>
                        </span>
                      </span>
                      <button
                        class="weekly-setting-switch"
                        id="windows-switch"
                        type="button"
                        aria-pressed="false"
                        aria-label="показывать окна"
                      >
                        <span aria-hidden="true"></span>
                      </button>
                    </div>

                    <div class="weekly-settings-row">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-layout">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <path d="M4 7h16M4 12h16M4 17h10" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>лёгкий вид</strong>
                          <span id="light-hint">плоские и компактные пары</span>
                        </span>
                      </span>
                      <button
                        class="weekly-setting-switch"
                        id="light-switch"
                        type="button"
                        aria-pressed="false"
                        aria-label="лёгкий вид"
                      >
                        <span aria-hidden="true"></span>
                      </button>
                    </div>

                    <div class="weekly-settings-row">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-week-scope">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="7" rx="2" />
                            <rect x="3" y="14" width="18" height="6" rx="2" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>вся неделя</strong>
                          <span id="scope-hint">показывать следующие дни ниже</span>
                        </span>
                      </span>
                      <button
                        class="weekly-setting-switch"
                        id="scope-switch"
                        type="button"
                        aria-pressed="true"
                        aria-label="вся неделя"
                      >
                        <span aria-hidden="true"></span>
                      </button>
                    </div>

                  </div>

                  <div class="weekly-settings-group">
                    <button class="weekly-settings-row" id="go-profile" type="button">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-theme">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.4" />
                            <path d="M5 20c1.6-3.4 4-5 7-5s5.4 1.6 7 5" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>профиль</strong>
                          <span id="profile-hint">выбор группы</span>
                        </span>
                      </span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </button>

                    <button class="weekly-settings-row" id="go-bells" type="button">
                      <span class="weekly-settings-row-main">
                        <span class="weekly-settings-icon is-offline">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="8" />
                            <path d="M12 8v4l3 2" />
                          </svg>
                        </span>
                        <span class="weekly-settings-copy">
                          <strong>расписание звонков</strong>
                          <span>пн–пт и сб</span>
                        </span>
                      </span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                        <path d="M9 6l6 6-6 6" />
                      </svg>
                    </button>

                    <div class="weekly-settings-freshness">
                      <span id="freshness">группа тм-303/б</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="date-strip" id="strip" data-selected-index="0">
            <button class="date-strip-week-arrow is-previous" id="prev-week" type="button" aria-label="предыдущая неделя">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" />
              </svg>
            </button>
            <span class="date-strip-selection" id="selection" aria-hidden="true"></span>
            <button class="date-strip-week-arrow" id="next-week" type="button" aria-label="следующая неделя">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                <path d="M9 6l6 6-6 6" />
              </svg>
            </button>
            <button class="date-strip-today" id="today-btn" type="button" aria-label="вернуться к сегодняшнему дню">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 7 4 12l5 5" />
                <path d="M4 12h9a6 6 0 0 1 6 6" />
              </svg>
              сегодня
            </button>
          </div>
        </header>

        <main class="weekly-schedule-view" id="schedule-view">
          <div class="weekly-days-scene" id="scene">
            <div class="weekly-active-day-stage" id="stage">
              <div class="weekly-active-day-scene" id="day-scene"></div>
            </div>
          </div>
        </main>

        <div class="homework-view" id="aux-view" hidden></div>

      </div>

      <div class="weekly-profile-backdrop" id="profile-backdrop" hidden></div>
      <div class="weekly-onboarding" id="onboarding" hidden></div>
    </div>
  </body>
</html>
