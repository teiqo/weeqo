name: update-schedule

on:
  schedule:
    # каждые 3 часа (GitHub может немного задерживать запуск)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pdfplumber
        run: python3 -m pip install --break-system-packages pdfplumber

      - name: parse pdf into data/schedule.json
        run: python3 tools/update_schedule.py

      - name: commit changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add data/
            git commit -m "chore: refresh schedule from sustec.ru"
            # Репозиторий мог уехать вперёд (твой пуш или другой прогон),
            # пока шёл парсинг, — иначе push падает с кодом 1 (non-fast-forward).
            git pull --rebase origin "${{ github.ref_name }}"
            git push || { git pull --rebase origin "${{ github.ref_name }}" && git push; }
          else
            echo "no changes"
          fi
