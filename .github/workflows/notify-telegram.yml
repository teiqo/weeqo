name: notify-telegram

on:
  schedule:
    # каждые 15 минут (GitHub может задерживать запуск)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify-telegram
  cancel-in-progress: false

jobs:
  notify:
    # секреты и переменные берутся из окружения github-pages
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: send telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SHARED_SWAPS_URL: ${{ vars.SHARED_SWAPS_URL }}
        run: python3 tools/notify_telegram.py

      - name: commit notify state
        run: |
          if [ -n "$(git status --porcelain data/notify-state.json)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add data/notify-state.json
            git commit -m "chore: notify state"
            git push
          else
            echo "no state changes"
          fi
