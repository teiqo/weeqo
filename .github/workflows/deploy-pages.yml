name: deploy pages

on:
  push:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build js/config.js from environment
        # Читаем каждое значение из ОБОИХ хранилищ: сначала Variables,
        # если там пусто — из Secrets. Так не важно, куда они были записаны.
        env:
          SHARED_SWAPS_URL: ${{ vars.SHARED_SWAPS_URL || secrets.SHARED_SWAPS_URL }}
          TELEGRAM_BOT_NAME: ${{ vars.TELEGRAM_BOT_NAME || secrets.TELEGRAM_BOT_NAME }}
          TELEGRAM_BOT_ID: ${{ vars.TELEGRAM_BOT_ID || secrets.TELEGRAM_BOT_ID }}
          TELEGRAM_OWNER_ID: ${{ vars.TELEGRAM_OWNER_ID || secrets.TELEGRAM_OWNER_ID }}
          TELEGRAM_ADMIN_IDS: ${{ vars.TELEGRAM_ADMIN_IDS || secrets.TELEGRAM_ADMIN_IDS }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          TELEGRAM_BOT_TOKEN_SHA256: ${{ secrets.TELEGRAM_BOT_TOKEN_SHA256 || vars.TELEGRAM_BOT_TOKEN_SHA256 }}
        run: |
          for v in SHARED_SWAPS_URL FIREBASE_API_KEY TELEGRAM_BOT_NAME TELEGRAM_BOT_ID TELEGRAM_BOT_TOKEN_SHA256; do
            if [ -z "$(eval "echo \$$v")" ]; then
              echo "::warning::$v пуст — создай его в Settings → Secrets and variables → Actions (вкладка Variables или Secrets)"
            fi
          done
          printf '%s\n' \
            '/* ---------- конфиг weeqo: генерируется Action-ом из окружения github-pages ---------- */' \
            "var SHARED_SWAPS_URL = \"${SHARED_SWAPS_URL}\";" \
            "var FIREBASE_API_KEY = \"${FIREBASE_API_KEY}\";" \
            "var TELEGRAM_BOT_NAME = \"${TELEGRAM_BOT_NAME}\";" \
            "var TELEGRAM_BOT_ID = \"${TELEGRAM_BOT_ID}\";" \
            "var TELEGRAM_OWNER_ID = \"${TELEGRAM_OWNER_ID}\";" \
            "var TELEGRAM_ADMIN_IDS = \"${TELEGRAM_ADMIN_IDS}\";" \
            "var TELEGRAM_BOT_TOKEN_SHA256 = \"${TELEGRAM_BOT_TOKEN_SHA256}\";" \
            > js/config.js
          grep -c '^var ' js/config.js

      - name: stage site (без служебных файлов)
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'tools' \
            --exclude 'dist' --exclude 'firebase-rules.json' \
            ./ dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
